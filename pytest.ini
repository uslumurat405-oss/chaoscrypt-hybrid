[pytest]
# tmp_path fixture'ının taban dizini %TEMP% yerine proje içine yönlendirilir.
# Bu makinede C:\Users\<user>\AppData\Local\Temp\pytest-of-<user> dizini bozuk
# ACL'lere sahip (erişim reddedilir); pytest bu dizini tarayamadığı için tüm
# tmp_path kullanan testler kurulum aşamasında PermissionError ile düşer.
addopts = --basetemp=.pytest_tmp
